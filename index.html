new GLTFLoader().load('./model.glb',g=>{ // real CC-BY Durango
  car.clear(); const m=g.scene;
  // normalize: center + scale to 4.9 length, sit wheels on y=0
  const bb=new THREE.Box3().setFromObject(m);

  // blackout: darken every opaque material (paint, trim, rims), keep textures; leave transparent glass/lenses
  m.traverse(o=>{if(o.isMesh){
    const mats=Array.isArray(o.material)?o.material:[o.material];
    for(const mt of mats){
      if(!mt) continue;
      if(mt.transparent){ mt.opacity=Math.min(mt.opacity,0.92); continue; }
      mt.color=new THREE.Color(0x1c1e23);
      mt.roughness=Math.min(mt.roughness??0.6,0.5);
      mt.metalness=0.5;
    }
  }});
  // ---- 2026 GT lamp restyle ----
  m.traverse(o=>{if(o.isMesh){
    if(o.name==='Object_55'){ // old round lamp internals: remove (replaced by 2026 lamp-face geometry)
      o.visible=false;
    }
    if(o.name==='Object_78'){ // racetrack taillight bar: wire to rear daytime/brake/third
      o.material=new THREE.MeshStandardMaterial({color:0x160b0c,roughness:0.3,metalness:0.5,emissive:new THREE.Color(0xff2a22),emissiveIntensity:0});
      LINKS.push({mat:o.material,slots:[0x03,0x04,0x11,0x09,0x0A,0x12],on:2.0});

    if(o.name==='Object_74'){ // factory DRL strips under the lamps: wire to DRL slots
      o.material=new THREE.MeshStandardMaterial({color:0x14161a,roughness:0.25,metalness:0.7,emissive:new THREE.Color(0xf2f7ff),emissiveIntensity:0});
      LINKS.push({mat:o.material,slots:[0x17,0x18],on:1.8});
    }
  }});
  car.add(m);
  m.updateMatrixWorld(true);
  buildRacetrack(m);
},undefined,()=>{buildRacetrack(null);}); // no model.glb: keep placeholder

// ---------- light emitters ----------
// slot -> {name, pos, color, size}  (front = -z)
const E=[];
const LINKS=[]; // model-material emissives driven by slots
function emit(slot,name,x,y,z,color,size,back){
  const g=new THREE.Group(); g.position.set(x,y,z);
  const lens=new THREE.Mesh(new THREE.CircleGeometry(size*0.55,20),new THREE.MeshBasicMaterial({color:0x101114,transparent:true,opacity:0.15}));
  const glow=new THREE.Mesh(new THREE.CircleGeometry(size*0.8,20),new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  if(!back){lens.rotation.y=Math.PI;glow.rotation.y=Math.PI;}
  g.add(lens);g.add(glow);scene.add(g);
  E.push({slot,name,glow,lens,color:new THREE.Color(color),on:false});
}
const AMBER=0xffa02e, RED=0xff2a22, WHITE=0xfff6e0, DRL=0xf2f7ff;

// ---------- 2026 GT lamp faces (added geometry) ----------
function rrect(w,h,r){const s=new THREE.Shape();const x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function lampFace(sgn){ // sgn=-1 left, +1 right
  const g=new THREE.Group();

  const ringShape=rrect(0.17,0.10,0.045); ringShape.holes.push(rrect(0.135,0.068,0.032));
  const ring=new THREE.Mesh(new THREE.ExtrudeGeometry(ringShape,{depth:0.016,bevelEnabled:false}),silver);

  const lensIn=new THREE.Mesh(new THREE.ShapeGeometry(rrect(0.135,0.068,0.032)),lensMat);
  lensIn.position.z=0.017;
  LINKS.push({mat:lensMat,slots:[sgn<0?0x01:0x02,sgn<0?0x13:0x14,sgn<0?0x15:0x16],on:2.2});
  const proj=new THREE.Group(); proj.add(ring); proj.add(lensIn);

  const amber=new THREE.Mesh(new THREE.ExtrudeGeometry(rrect(0.105,0.052,0.02),{depth:0.014,bevelEnabled:false}),amberMat);

  g.add(brow);
  scene.add(g);
}

// ---- 2026 racetrack taillight: thin LED strip following the real liftgate surface ----
const RSURF=[
[1.62,1.96,2.18,2.26,2.30,2.30,2.31,2.32,2.34,2.35,2.35,2.36,2.37,2.37,2.38,2.38,2.38,2.37,2.37,2.36,2.35,2.35,2.34,2.32,2.31,2.30,2.30,2.26,2.18,1.96,1.62],
[1.61,1.96,2.16,2.25,2.28,2.30,2.32,2.33,2.34,2.35,2.36,2.37,2.37,2.38,2.38,2.38,2.38,2.38,2.37,2.37,2.36,2.35,2.34,2.33,2.32,2.30,2.28,2.25,2.16,1.96,1.61],
[1.56,1.95,2.17,2.25,2.29,2.30,2.32,2.33,2.34,2.35,2.36,2.37,2.38,2.38,2.38,2.38,2.38,2.38,2.38,2.37,2.36,2.35,2.34,2.33,2.32,2.30,2.29,2.25,2.17,1.95,1.56],
[1.48,1.94,2.17,2.25,2.28,2.30,2.32,2.33,2.34,2.35,2.36,2.36,2.37,2.37,2.38,2.38,2.38,2.37,2.37,2.36,2.36,2.35,2.34,2.33,2.32,2.30,2.28,2.25,2.17,1.94,1.48],
[1.33,1.92,2.17,2.25,2.29,2.31,2.32,2.34,2.34,2.33,2.34,2.35,2.35,2.37,2.37,2.37,2.37,2.37,2.35,2.35,2.34,2.33,2.34,2.34,2.32,2.31,2.29,2.25,2.17,1.92,1.33],

[1.78,1.78,2.10,2.24,2.29,2.32,2.33,2.35,2.36,2.37,2.39,2.39,2.40,2.40,2.40,2.41,2.40,2.40,2.40,2.39,2.39,2.37,2.36,2.35,2.33,2.32,2.29,2.24,2.10,1.78,1.78],
[1.67,2.23,2.09,2.23,2.29,2.32,2.33,2.35,2.36,2.37,2.38,2.39,2.39,2.40,2.40,2.40,2.40,2.40,2.39,2.39,2.38,2.37,2.36,2.35,2.33,2.32,2.29,2.23,2.09,2.23,1.67],
[2.21,2.21,1.95,2.21,2.28,2.31,2.32,2.34,2.35,2.36,2.37,2.38,2.38,2.38,2.39,2.39,2.39,2.38,2.38,2.38,2.37,2.36,2.35,2.34,2.32,2.31,2.28,2.21,1.95,2.21,2.21]];
function rearZ(x,y){
  const fx=Math.min(Math.max((x+0.9)/0.06,0),30), fy=Math.min(Math.max((y-0.8)/0.04,0),9);
  const x0=Math.floor(fx), y0=Math.floor(fy), x1=Math.min(x0+1,30), y1=Math.min(y0+1,9);
  const tx=fx-x0, ty=fy-y0;
  const a=RSURF[y0][x0]*(1-tx)+RSURF[y0][x1]*tx, b=RSURF[y1][x0]*(1-tx)+RSURF[y1][x1]*tx;
  return a*(1-ty)+b*ty;
}
function buildRacetrack(model){
  const ray=new THREE.Raycaster(); const rdir=new THREE.Vector3(0,0,-1);
  // some model meshes are single-sided facing the cabin; flip to DoubleSide while probing so the true visible surface is found
  const flipped=[];
  if(model){ model.traverse(o=>{ if(o.isMesh){ const ms=Array.isArray(o.material)?o.material:[o.material]; for(const mt of ms){ if(mt){ flipped.push([mt,mt.side]); mt.side=THREE.DoubleSide; } } }}); }
  function surfZ(x,y){
    if(model){ ray.set(new THREE.Vector3(x,y,6),rdir); const h=ray.intersectObject(model,true); if(h.length) return h[0].point.z; }
    return rearZ(x,y);
  }
  // smoothed surface z along the loop (guards against stray glass hits)
  function loopPts(shape,off){
    const raw=shape.getPoints(220);
    let prev=null; const out=[];
    for(const p of raw){
      let z=surfZ(p.x,0.98+p.y);
      if(prev!==null && Math.abs(z-prev)>0.06) z=prev;
      prev=z; out.push(new THREE.Vector3(p.x,0.98+p.y,z+off));
    }
    return out;
  }
  const shape=rrect(1.62,0.22,0.10);
  const pts=loopPts(shape,0.016);
  const curve=new THREE.CatmullRomCurve3(pts,true);
  const dayMat=new THREE.MeshStandardMaterial({color:0x20090a,roughness:0.25,metalness:0.4,emissive:new THREE.Color(0xff2a22),emissiveIntensity:0});
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,260,0.0105,8,true),dayMat));
  LINKS.push({mat:dayMat,slots:[0x03,0x04,0x11],on:2.0});
  const pts2=loopPts(shape,0.021);
  const curve2=new THREE.CatmullRomCurve3(pts2,true);
  const brakeMat=new THREE.MeshStandardMaterial({color:0x20090a,roughness:0.25,metalness:0.4,emissive:new THREE.Color(0xff1a12),emissiveIntensity:0});
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve2,260,0.0105,8,true),brakeMat));
  LINKS.push({mat:brakeMat,slots:[0x09,0x0A,0x12],on:3.2});
  // high-mount third brake: thin strip at the top of the rear glass
  const tm=new THREE.MeshStandardMaterial({color:0x20090a,roughness:0.3,metalness:0.4,emissive:new THREE.Color(0xff1a12),emissiveIntensity:0});
  const tstrip=new THREE.Mesh(new THREE.BoxGeometry(0.50,0.026,0.014),tm);
  tstrip.position.set(0,1.55,2.135); tstrip.rotation.x=-0.18; scene.add(tstrip);
  LINKS.push({mat:tm,slots:[0x12],on:2.6});
  // wide white reverse strips, one per side, like the real lamp
  for(const sgn of [-1,1]){
    const rm=new THREE.MeshStandardMaterial({color:0x111214,roughness:0.2,metalness:0.5,emissive:new THREE.Color(0xf2f7ff),emissiveIntensity:0});
    const bar=new THREE.Mesh(new THREE.BoxGeometry(0.30,0.028,0.014),rm);
    bar.position.set(sgn*0.30,1.03,surfZ(sgn*0.30,1.03)+0.02); scene.add(bar);
    LINKS.push({mat:rm,slots:sgn<0?[0x0B,0x0D]:[0x0C,0x0E],on:2.4});
  }
  for(const [mt,sd] of flipped) mt.side=sd;
}

const DEAD={0x0F:'LF fog (not on GT)',0x10:'RF fog (not on GT)',0x1B:'cargo (not on Durango)',0x1C:'unknown 3C',0x1D:'clearance (trucks only)'};

// ---------- cls parsing & playback ----------
let steps=[], playing=true, idx=0, acc=0, flashQueue=[];
const speeds={slow:120,medium:70,fast:35,ludicrous:18};
function slotOf(v){return v&0x1F}
function cmdOf(v){return v&0xE0}
function parseCls(text){
  const lines=text.split(/\s+/).map(s=>s.trim().toUpperCase()).filter(s=>s.length>0);
  const out=[],dead=new Set();
  for(const ln of lines){
    if(!/^[0-9A-F]{2}$/.test(ln)) continue;
    const v=parseInt(ln,16), slot=slotOf(v), cmd=cmdOf(v);
    if(v===0){out.push({type:'delay'});continue}
    if(DEAD[slot]){dead.add(DEAD[slot]);continue}
    const e=E.find(e=>e.slot===slot);
    if(!e){dead.add('slot '+slot.toString(16).toUpperCase());continue}
    if(cmd===0x20) out.push({type:'set',e,on:true});
    else if(cmd===0x00) out.push({type:'set',e,on:false});
    else if(cmd===0xA0) out.push({type:'flash',e,times:2});
    else if(cmd===0xC0) out.push({type:'flash',e,times:3});
  }
  const w=document.getElementById('warn');
  if(dead.size){w.textContent='Skipped (not on this Durango): '+[...dead].join(', ');w.style.display='block'}
  else w.style.display='none';
  return out;
}
function allOff(){for(const e of E){e.on=false}}
function loadSteps(list,name){allOff();steps=list;idx=0;acc=0;flashQueue=[];document.getElementById('pname').textContent=name||''}
function runStep(st){
  if(st.type==='set'){st.e.on=st.on}
  else if(st.type==='flash'){
    // expand to blinks: on,off x times at current cadence
    for(let i=0;i<st.times;i++){flashQueue.push({e:st.e,on:true},{e:st.e,on:false})}
  }
}
function tick(dt){
  if(!playing||!steps.length)return;
  acc+=dt*1000;
  const stepMs=Number(document.getElementById('speed').value);
  while(acc>=stepMs){
    acc-=stepMs;
    if(flashQueue.length){const f=flashQueue.shift();f.e.on=f.on}
    else{
      runStep(steps[idx]);
      document.getElementById('stepinfo').textContent=(idx+1)+' / '+steps.length;
      idx=(idx+1)%steps.length;
    }
  }
}
function renderEmitters(){
  for(const e of E){
    e.glow.material.opacity=e.on?0.8:0;
    e.lens.material.color=e.on?e.color:new THREE.Color(0x1a1c1f);
  }
  for(const l of LINKS){
    l.mat.emissiveIntensity=l.slots.some(sl=>E.find(e=>e.slot===sl&&e.on))?l.on:0;
  }
}

// built-in patterns (the set made for this Durango) + upload override
const PATTERNS={
 'Intersection Wig-Wag':'37 21 27 29 2D 00 17 01 07 09 0D 00 38 22 28 2A 2E 00 18 02 08 0A 0E 00',
 'Sweep':'27 00 07 37 00 17 21 00 01 22 00 02 38 00 18 28 00 08 00 2D 00 0D 29 00 09 32 00 12 2A 00 0A 2E 00 0E 00',
 'Hi-Vis 360':'37 17 37 17 37 17 38 18 38 18 38 18 00 29 09 29 09 29 09 2A 0A 2A 0A 2A 0A 00 23 24 31 32 12 32 12 03 04 11 00',
 'Rear Guard':'29 2A 32 00 09 0A 12 00 29 2A 32 00 09 0A 12 00 2B 2C 2D 2E 00 0B 0C 0D 0E 00 2B 2C 2D 2E 00 0B 0C 0D 0E 00',
 'Full Send (unconfirmed)':'36 2F 21 29 2D 00 16 0F 01 09 0D 00 35 30 22 2A 2E 00 15 10 02 0A 0E 00 3B 00 1B 00'
};
const patSel=document.getElementById('pat');
const VIEWS={'Rear Guard':[5.6,2.7,6.8],'Hi-Vis 360':[5.6,2.7,6.8]};
patSel.onchange=()=>{const n=patSel.value; if(PATTERNS[n]){loadSteps(parseCls(PATTERNS[n]),n); playing=true; document.getElementById('play').textContent='Pause';
  const v=VIEWS[n]||[-6.4,2.9,-7.0]; camera.position.set(v[0],v[1],v[2]); controls.target.set(0,0.8,0); controls.update();}};
loadSteps(parseCls(PATTERNS['Intersection Wig-Wag']),'Intersection Wig-Wag');

// ---------- ui ----------
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};
function handleFile(f){
  const r=new FileReader();
  r.onload=()=>{loadSteps(parseCls(r.result),f.name.replace(/\.cls$/i,''));patSel.value='__custom';playing=true;document.getElementById('play').textContent='Pause'};
  r.readAsText(f);
}
document.getElementById('file').onchange=ev=>{if(ev.target.files[0])handleFile(ev.target.files[0])};
const drop=document.getElementById('drop');
addEventListener('dragover',e=>{e.preventDefault();drop.style.display='flex'});
addEventListener('dragleave',e=>{if(e.target===drop)drop.style.display='none'});
addEventListener('drop',e=>{e.preventDefault();drop.style.display='none';if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ---------- loop ----------
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  tick(dt); renderEmitters(); controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
